x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      LOG_FILE: "/data/vaultwarden.log"
      LOG_LEVEL: "warn"
      TZ: "UTC"
    volumes:
      - ./vw-data:/data

  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    logging: *default-logging
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-config:/config
      - ./caddy-data:/data
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${ACME_EMAIL}
      LOG_FILE: "/data/access.log"

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    restart: always
    logging: *default-logging
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: "UTC"
      F2B_LOG_LEVEL: "INFO"
    volumes:
      - ./fail2ban-data:/data
      - ./vw-data:/var/log/vaultwarden:ro

  vaultwarden-backup:
    image: ttionya/vaultwarden-backup:latest
    container_name: vaultwarden-backup
    restart: always
    logging: *default-logging
    depends_on:
      - vaultwarden
    environment:
      RCLONE_REMOTE_NAME: "yandex-disk"
      RCLONE_REMOTE_DIR: "/VaultwardenBackup"
      CRON: "30 3 * * *"
      BACKUP_KEEP_DAYS: "1"
      ZIP_ENABLE: "FALSE"
      TZ: "UTC"
    volumes:
      - ./vw-data:/bitwarden/data/:ro
      - ./rclone-data:/config/
